name: Probe (temporal)
on:
  push:
    branches: [claude/admiring-archimedes-thrbbs]
    paths: [scripts/scrape/**, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: SCRAPER_DEBUG=1 node scripts/scrape/index.mjs
      - run: node scripts/build-data.mjs
      - run: for f in data/scraped/*.json; do echo "== $f"; head -c 3000 "$f"; echo; done
      - name: Guardar datos en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped src/data/descuentos.json
          git diff --cached --quiet || (git commit -m "Datos scrapeados (prueba)" && git push)
